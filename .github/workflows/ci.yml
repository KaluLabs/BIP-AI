name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Verify runner Node.js
        run: node -e "const major=Number(process.versions.node.split('.')[0]); console.log('Node', process.versions.node); if (major < 22) { console.error('Node.js 22+ is required on the self-hosted runner.'); process.exit(1); }"
      - name: Verify npm
        run: npm --version
      - name: Run test suite
        run: npm test
